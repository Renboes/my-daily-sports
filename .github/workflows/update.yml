name: Mise à jour des calendriers
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node update.js
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
      - name: Enregistrer les changements
        run: |
          git config user.name "calendrier-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Mise à jour des calendriers" && git push)
