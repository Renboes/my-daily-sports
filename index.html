<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0e0e10;--card:#18181b;--ink:#f5f5f4;--mut:#a1a1aa;--line:#2c2c31}

:root[data-theme="dark"]{--bg:#0e0e10;--card:#18181b;--ink:#f5f5f4;--mut:#a1a1aa;--line:#2c2c31}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.35 "Barlow Condensed","Arial Narrow",system-ui,sans-serif}
button{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:16px 10px 32px}
h1{font-size:30px;line-height:1.1;margin:0 0 4px;font-weight:700}
.note{margin:0 0 14px;color:var(--mut);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sc{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:600;cursor:pointer}

.nb{border:1px solid var(--line);background:var(--card);border-radius:8px;min-width:40px;height:36px;padding:0 10px;cursor:pointer;font-weight:700}

.cell.out{background:transparent;border-color:transparent}

.dn{background:none;border:0;padding:0 2px;text-align:left;color:var(--mut);font-weight:700;cursor:pointer;font-size:14px}

.ev span{overflow:hidden;text-overflow:ellipsis}
.f{display:none}
.more{background:none;border:0;padding:0 2px;color:var(--mut);font-weight:700;text-align:left;cursor:pointer;font-size:13px}

.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}

[hidden]{display:none!important}
.ev.done{opacity:.5}
.tw{overflow-x:auto}
.cls{width:100%;border-collapse:collapse;font-size:16px;margin:4px 0 14px}

.wordmark{display:block;width:min(280px,72vw);height:auto;margin:10px auto 4px}
.brand2{text-align:center}

.logo{border-radius:12px;flex:none}
.hello{font-size:23px;font-weight:600;margin:4px 0 16px;line-height:1.2;text-align:center}

.hero{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));border-left:5px solid var(--c);border-radius:16px;padding:14px 16px;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 22%,var(--card)),var(--card));cursor:pointer;margin-bottom:14px}

</style>
</head>
