<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Daily Sports">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15110f">
<title>My Daily Sports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7efe4;--card:#fffaf3;--ink:#1d1712;--mut:#7a6a5a;--line:#e6d8c6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110f;--card:#1f1915;--ink:#f6efe7;--mut:#a8998a;--line:#352b24}}
:root[data-theme="dark"]{--bg:#15110f;--card:#1f1915;--ink:#f6efe7;--mut:#a8998a;--line:#352b24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.35 "Barlow Condensed","Arial Narrow",system-ui,sans-serif}
button{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:16px 10px 32px}
h1{font-size:30px;line-height:1.1;margin:0 0 4px;font-weight:700}
.note{margin:0 0 14px;color:var(--mut);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sc{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.ev:focus-visible,.dn:focus-visible,.row:focus-visible,.nb:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.nav{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.nav h2{flex:1;margin:0;font-size:24px;font-weight:700;text-transform:capitalize}
.nb{border:1px solid var(--line);background:var(--card);border-radius:8px;min-width:40px;height:36px;padding:0 10px;cursor:pointer;font-weight:700}
.nb:disabled{opacity:.35;cursor:default}
.grid,.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{margin-bottom:4px;color:var(--mut);font-weight:600;font-size:14px;text-align:center}
.cell{min-height:92px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cell.out{background:transparent;border-color:transparent}
.cell.today{border:2px solid var(--ink)}
.dn{background:none;border:0;padding:0 2px;text-align:left;color:var(--mut);font-weight:700;cursor:pointer;font-size:14px}
.ev{display:flex;align-items:center;gap:3px;width:100%;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card));border-radius:4px;padding:2px 3px;font-size:13px;font-weight:700;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden}
.ev span{overflow:hidden;text-overflow:ellipsis}
.f{display:none}
.more{background:none;border:0;padding:0 2px;color:var(--mut);font-weight:700;text-align:left;cursor:pointer;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(8,12,20,.55);display:flex;align-items:flex-end;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));z-index:10}
.ov[hidden]{display:none}
.dlg{background:var(--card);border-radius:14px;width:100%;max-width:420px;max-height:80vh;overflow:auto;padding:20px}
.dlg h3{margin:8px 0 4px;font-size:26px;line-height:1.15;font-weight:700}
.dlg p{margin:6px 0}
.meta{color:var(--mut)}
.badge{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--c) 22%,var(--card));border:2px solid var(--c)}
.tag{display:inline-block;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card));padding:1px 8px;border-radius:4px;font-weight:700}
.row{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));border-radius:6px;padding:8px 10px;margin:6px 0;cursor:pointer;font-weight:600}
.x{margin-top:12px}
.date{margin:0 0 14px;color:var(--mut);font-size:21px;font-weight:600}.date::first-letter{text-transform:uppercase}
.go{display:block;width:100%;border:0;border-radius:12px;background:linear-gradient(110deg,#f43f5e,#f97316 55%,#fbbf24);color:#1a0f0a;font:700 22px "Barlow Condensed","Arial Narrow",system-ui,sans-serif;padding:14px;cursor:pointer;margin:0 0 8px}
.go:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.sec{font-size:24px;margin:22px 0 6px;font-weight:700}
.back{margin-bottom:10px}
.empty{color:var(--mut);margin:6px 0}
.sm{padding:2px 10px;font-size:14px}
.sph{display:flex;align-items:center;gap:6px;margin:16px 0 4px}.sph b{flex:1;font-size:18px}
.lgr{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.lgr label{flex:1;display:flex;gap:8px;align-items:center;cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.star{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--mut);padding:0 4px}
.star[aria-pressed="true"]{color:#f59e0b}
input[type=checkbox]{width:19px;height:19px;accent-color:#2f7a3c}
#tq{width:100%;padding:9px 12px;margin:6px 0 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.cfg{display:block;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px;font:600 17px "Barlow Condensed","Arial Narrow",system-ui,sans-serif;cursor:pointer;margin:0 0 6px}
.topbar{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.brand .date{margin:0;font-size:19px}
.logo{border-radius:12px;flex:none}
.hello{font-size:23px;font-weight:600;margin:4px 0 16px;line-height:1.2}
.hk0{font-size:15px;font-weight:600;color:var(--mut);margin:0 0 6px}
.hero{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));border-left:5px solid var(--c);border-radius:16px;padding:14px 16px;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 22%,var(--card)),var(--card));cursor:pointer;margin-bottom:14px}
.hero:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.he{font-size:42px;line-height:1}
.hb{display:flex;flex-direction:column;min-width:0}
.hk{font-size:15px;font-weight:700;color:var(--mut)}
.ht{font-size:25px;font-weight:700;line-height:1.15}
.hl{font-size:15px;color:var(--mut)}
#home .note{margin-top:22px}
@media (min-width:720px){.s{display:none}.f{display:inline}.cell{min-height:112px}.wrap{padding:24px 16px 40px}h1{font-size:38px}.ov{align-items:center}}
</style>
</head>
<body>
<div class="wrap">
<section id="home">
<header class="brand"><img class="logo" src="favicon.svg" alt="" width="54" height="54"><div><h1>My Daily Sports</h1><p class="date" id="today"></p></div></header>
<p class="hello" id="hello"></p>
<div id="hero"></div>
<button class="go" data-go="cal">📅 Ouvrir le calendrier</button>
<button class="cfg" id="cfg">⚙️ Mes compétitions et mes favoris</button>
<h2 class="sec">Au programme aujourd'hui</h2>
<div id="tl"></div>
<div id="fv"></div>
<h2 class="sec">Prochainement</h2>
<div id="nx"></div>
<p class="note" id="src"></p>
<p class="note" id="upd"></p>
</section>
<section id="cal" hidden>
<div class="topbar"><button class="nb" data-go="home">‹ Accueil</button><button class="nb" id="cfg2">⚙️ Personnaliser</button></div>
<div id="sports" class="chips"></div>
<div id="leagues" class="chips"></div>
<div id="teams" class="chips sc"></div>
<div class="nav">
<button class="nb" id="prev" aria-label="Mois précédent">‹</button>
<h2 id="mt"></h2>
<button class="nb" id="today">Aujourd'hui</button>
<button class="nb" id="next" aria-label="Mois suivant">›</button>
</div>
<div class="dow"><div>lun</div><div>mar</div><div>mer</div><div>jeu</div><div>ven</div><div>sam</div><div>dim</div></div>
<div id="grid" class="grid"></div>
</section>
</div>
<div id="ov" class="ov" hidden><div id="box" class="dlg" role="dialog" aria-modal="true"></div></div>
<script>
const SP={foot:{n:"Football",e:"⚽"},basket:{n:"Basketball",e:"🏀"},moto:{n:"MotoGP",e:"🏍️"},f1:{n:"Formule 1",e:"🏎️"},rugby:{n:"Rugby",e:"🏉"},biathlon:{n:"Biathlon",e:"🎿"},usfoot:{n:"Football américain",e:"🏈"},hockey:{n:"Hockey sur glace",e:"🏒"},mma:{n:"MMA",e:"🥊"}};
const L={
l1:{n:"Ligue 1",s:"L1",f:"Ligue 1",sp:"foot",c:"#2563eb"},
l2:{n:"Ligue 2",s:"L2",f:"Ligue 2",sp:"foot",c:"#0d9488"},
ldn:{n:"Ligue des Nations",s:"LDN",f:"Ligue des Nations",sp:"foot",c:"#7c3aed"},
nba:{n:"NBA",s:"NBA",f:"NBA",sp:"basket",c:"#ea580c"},
elite:{n:"Betclic Élite",s:"Élite",f:"Betclic Élite",sp:"basket",c:"#d97706"},
euro:{n:"Euroligue",s:"Euro",f:"Euroligue",sp:"basket",c:"#c2410c"},
moto:{n:"MotoGP",s:"Moto",f:"MotoGP",sp:"moto",c:"#65a30d"},
f1:{n:"Formule 1",s:"F1",f:"F1",sp:"f1",c:"#e11d48"},
ucl:{n:"Ligue des champions",s:"LDC",f:"Ligue des champions",sp:"foot",c:"#0ea5e9"},
uel:{n:"Europa League",s:"UEL",f:"Europa League",sp:"foot",c:"#be185d"},
pl:{n:"Premier League",s:"PL",f:"Premier League",sp:"foot",c:"#c026d3"},
liga:{n:"La Liga",s:"Liga",f:"La Liga",sp:"foot",c:"#dc2626"},
sa:{n:"Serie A",s:"SA",f:"Serie A",sp:"foot",c:"#16a34a"},
bl:{n:"Bundesliga",s:"BL",f:"Bundesliga",sp:"foot",c:"#a16207"},
nfl:{n:"NFL",s:"NFL",f:"NFL",sp:"usfoot",c:"#1e40af"},
nhl:{n:"NHL",s:"NHL",f:"NHL",sp:"hockey",c:"#0891b2"},
ufc:{n:"UFC",s:"UFC",f:"UFC",sp:"mma",c:"#b91c1c"},
rt14:{n:"Top 14",s:"T14",f:"Top 14",sp:"rugby",c:"#0e7490"},
rec:{n:"Coupe d'Europe",s:"CE",f:"Coupe d'Europe",sp:"rugby",c:"#4338ca"},
r6n:{n:"Six Nations",s:"6N",f:"Six Nations",sp:"rugby",c:"#a21caf"},
rint:{n:"Matchs internationaux",s:"XV",f:"Matchs internationaux",sp:"rugby",c:"#15803d"},
rwc:{n:"Coupe du monde de rugby",s:"CM",f:"Coupe du monde",sp:"rugby",c:"#ca8a04"},
bwc:{n:"Coupe du monde de biathlon",s:"CM",f:"Coupe du monde",sp:"biathlon",c:"#0284c7"},
bch:{n:"Championnats du monde de biathlon",s:"Mondial",f:"Championnats du monde",sp:"biathlon",c:"#7c3aed"},
beu:{n:"Championnats d'Europe de biathlon",s:"Euro",f:"Championnats d'Europe",sp:"biathlon",c:"#0d9488"}};
["f1","moto","nba","rt14","rec","r6n","rint","rwc","bwc","bch","beu"].forEach(k=>L[k].r=1);
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0");
let EV=[];
let sp="all",lg="all",tm="all";
const now=new Date(),Y=now.getFullYear();
let cur={y:Y,m:now.getMonth()};
const key=(y,m,d)=>y+"-"+pad(m+1)+"-"+pad(d);
const teams=e=>/^(foot|basket|rugby|usfoot|hockey)$/.test(L[e.l].sp)&&e.ti.includes(" - ")?e.ti.split(" - "):[];
const lsg=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}};
const hid=new Set(lsg("mds_hid")),fl=new Set(lsg("mds_fl")),ft=new Set(lsg("mds_ft"));
const sv=()=>{try{localStorage.setItem("mds_hid",JSON.stringify([...hid]));localStorage.setItem("mds_fl",JSON.stringify([...fl]));localStorage.setItem("mds_ft",JSON.stringify([...ft]))}catch(e){}};
let fav=false;
const isFav=e=>fl.has(e.l)||teams(e).some(t=>ft.has(t)),hasFav=()=>fl.size+ft.size>0;
const vis=()=>EV.filter(e=>!hid.has(e.l)&&(fav?isFav(e):(sp==="all"||L[e.l].sp===sp)&&(lg==="all"||e.l===lg)&&(tm==="all"||teams(e).includes(tm))));
const dl=k=>{const[a,b,c]=k.split("-");return new Date(a,b-1,c).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})};
const hh=t=>t.replace(":","h");
function filters(){
const sps=Object.entries(SP).filter(([k])=>Object.entries(L).some(([x,l])=>l.sp===k&&!hid.has(x)));
$("#sports").innerHTML=[["all","Tout","📅"],...(hasFav()?[["fav","Mes favoris","⭐"]]:[]),...sps.map(([k,v])=>[k,v.n,v.e])].map(([k,n,e])=>`<button class="chip" aria-pressed="${k==="fav"?fav:!fav&&sp===k}" data-sp="${k}">${e} ${n}</button>`).join("");
const ls=fav?[]:Object.entries(L).filter(([k,v])=>v.sp===sp&&!hid.has(k));
$("#leagues").innerHTML=ls.length>1?[["all","Toutes les ligues"],...ls.map(([k,v])=>[k,v.f])].map(([k,n])=>`<button class="chip" aria-pressed="${lg===k}" data-lg="${k}">${n}</button>`).join(""):"";
const ts=fav||lg==="all"?[]:[...new Set(EV.filter(e=>e.l===lg).flatMap(teams))].sort((a,b)=>a.localeCompare(b,"fr"));
$("#teams").innerHTML=ts.length?[["all","Toutes les équipes"],...ts.map(x=>[x,x])].map(([k,n])=>`<button class="chip" aria-pressed="${tm===k}" data-tm="${k}">${n}</button>`).join(""):"";
}
const chip=(k,es)=>{const e=es[0],l=L[e.l];return `<button class="ev" style="--c:${l.c}" data-g="${k}|${e.l}"><span>${SP[l.sp].e}</span><span class="s">${l.s}</span><span class="f">${l.f}</span></button>`};
const unit=l=>/^(foot|basket|rugby|usfoot|hockey)$/.test(L[l].sp)?"matchs":L[l].sp==="mma"?"événements":"sessions";
function grid(){
const{y,m}=cur,map={};
$("#mt").textContent=new Date(y,m,1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
vis().forEach(e=>(map[e.d]=map[e.d]||[]).push(e));
const off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),max=innerWidth<720?2:3,tk=key(now.getFullYear(),now.getMonth(),now.getDate());
let h="";
for(let i=0;i<Math.ceil((off+n)/7)*7;i++){
const d=i-off+1;
if(d<1||d>n){h+='<div class="cell out"></div>';continue}
const k=key(y,m,d),es=map[k]||[],gs=Object.values(es.reduce((a,e)=>((a[e.l]=a[e.l]||[]).push(e),a),{}));
h+=`<div class="cell${k===tk?" today":""}"><button class="dn" data-day="${k}">${d}</button>`+gs.slice(0,max).map(g=>chip(k,g)).join("")+(gs.length>max?`<button class="more" data-day="${k}">+${gs.length-max}</button>`:"")+"</div>";
}
$("#grid").innerHTML=h;
$("#prev").disabled=y===Y&&m===0;
$("#next").disabled=y===Y+1&&m===11;
}
const tk=()=>key(now.getFullYear(),now.getMonth(),now.getDate());
const sd=k=>{const[a,b,c]=k.split("-");return new Date(a,b-1,c).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})};
const rw=(e,full)=>{const l=L[e.l];return `<button class="row" style="--c:${l.c}" data-ev="${EV.indexOf(e)}"><b>${full?sd(e.d)+(e.t?" "+hh(e.t):""):(e.t?hh(e.t):"Journée")}</b> ${isFav(e)?"⭐ ":""}${SP[l.sp].e} ${l.f} : ${e.ti}</button>`};
const hero=(e,k,f)=>{const l=L[e.l],dd=Math.round((new Date(e.d)-new Date(k))/864e5),w=dd===0?"Aujourd'hui":dd===1?"Demain":"Dans "+dd+" jours";return `<div class="hk0">${f?"Prochain parmi mes favoris":"Prochain rendez-vous"}</div><button class="hero" style="--c:${l.c}" data-ev="${EV.indexOf(e)}"><span class="he">${SP[l.sp].e}</span><span class="hb"><span class="hk">${w}${e.t?", "+hh(e.t):""}</span><span class="ht">${e.ti}</span><span class="hl">${l.f}</span></span></button>`};
function home(){
const h=now.getHours(),g=h>=18||h<5?"Bonsoir":h<12?"Bonjour":"Bon après-midi",k=tk(),hm=pad(h)+":"+pad(now.getMinutes());
$("#today").textContent=now.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const vs=EV.filter(e=>!hid.has(e.l)),fv=hasFav()?vs.filter(isFav):[],up=a=>a.filter(e=>e.d>k||(e.d===k&&(!e.t||e.t>=hm)));
const td=vs.filter(e=>e.d===k),nx=vs.filter(e=>e.d>k),uf=up(fv)[0],hh1=uf||up(vs)[0];
$("#hello").textContent=g+" ! "+(td.length?(td.length===1?"Un rendez-vous sportif aujourd'hui.":td.length+" rendez-vous sportifs aujourd'hui."):"Pas de sport aujourd'hui, voici la suite.");
$("#hero").innerHTML=hh1?hero(hh1,k,!!uf):"";
$("#tl").innerHTML=td.length?td.map(e=>rw(e)).join(""):"<p class=\"empty\">Rien au programme aujourd'hui. Profites-en pour souffler !</p>";
$("#fv").innerHTML=fv.length?'<h2 class="sec">Mes favoris</h2>'+up(fv).slice(0,6).map(e=>rw(e,1)).join(""):"";
$("#nx").innerHTML=nx.slice(0,6).map(e=>rw(e,1)).join("");
}
function refresh(){
if(sp!=="all"&&!Object.entries(L).some(([k,l])=>l.sp===sp&&!hid.has(k)))sp="all";
if(lg!=="all"&&hid.has(lg))lg="all";
if(fav&&!hasFav())fav=false;
filters();grid();home();
}
const allTeams=()=>[...new Set(EV.filter(e=>!hid.has(e.l)).flatMap(teams))].sort((a,b)=>a.localeCompare(b,"fr"));
function tfav(){$("#tfav").innerHTML=[...ft].map(n=>`<button class="chip sm" aria-pressed="true" data-fx="${n}">${n} ×</button>`).join("")||'<span class="meta">Aucune équipe pour l\'instant.</span>'}
function tres(){const q=$("#tq").value.trim().toLowerCase();$("#tres").innerHTML=q.length<2?"":(allTeams().filter(n=>n.toLowerCase().includes(q)&&!ft.has(n)).slice(0,10).map(n=>`<button class="chip sm" data-ft="${n}">+ ${n}</button>`).join("")||'<span class="meta">Aucune équipe trouvée.</span>')}
function cfgOpen(){
let x='<h3>Mes compétitions</h3><p class="meta">Décoche ce qui ne t\'intéresse pas du tout. L\'étoile marque ce que tu veux suivre en priorité.</p>';
for(const [s,v] of Object.entries(SP)){
x+=`<div class="sph"><b>${v.e} ${v.n}</b><button class="chip sm" data-sa="${s}">Tout</button><button class="chip sm" data-sn="${s}">Aucun</button></div>`;
for(const [k,l] of Object.entries(L))if(l.sp===s)x+=`<div class="lgr"><label><input type="checkbox" data-hid="${k}" data-s="${s}"${hid.has(k)?"":" checked"}><span class="dot" style="--c:${l.c}"></span>${l.f}</label><button class="star" data-fl="${k}" aria-pressed="${fl.has(k)}" aria-label="Favori">★</button></div>`;
}
x+='<h3>Mes équipes favorites</h3><input id="tq" placeholder="Chercher une équipe (PSG, Lakers…)" autocomplete="off"><div id="tres" class="chips"></div><div id="tfav" class="chips"></div>';
show(x);tfav();
}
function go(v){$("#home").hidden=v!=="home";$("#cal").hidden=v!=="cal";scrollTo(0,0);if(v==="cal")grid()}
const ov=$("#ov"),box=$("#box");
function show(h){box.innerHTML=h+'<button class="chip x" data-x>Fermer</button>';ov.hidden=false}
function detail(i){const e=EV[i],l=L[e.l];show(`<div class="badge" style="--c:${l.c}">${SP[l.sp].e}</div><h3>${e.ti}</h3><p class="meta">${dl(e.d)}${e.t?", "+hh(e.t):""}</p><p><span class="tag" style="--c:${l.c}">${l.n}</span></p><p>${e.de}</p>${l.r?"":"<p class=\"meta\">Donnée d'exemple, à remplacer par la vraie.</p>"}`)}
function grp(s){const[k,l]=s.split("|"),es=vis().filter(e=>e.d===k&&e.l===l);if(es.length===1)return detail(EV.indexOf(es[0]));show(`<h3>${L[l].f}</h3><p class="meta">${dl(k)}, ${es.length} ${unit(l)}</p>`+es.map(e=>`<button class="row" style="--c:${L[l].c}" data-ev="${EV.indexOf(e)}">${e.t?hh(e.t)+", ":""}${e.ti}</button>`).join(""))}
function day(k){const es=vis().filter(e=>e.d===k),G={};es.forEach(e=>(G[e.l]=G[e.l]||[]).push(e));show(`<h3>${dl(k)}</h3>`+(es.length?Object.entries(G).map(([l,g])=>g.length===1?`<button class="row" style="--c:${L[l].c}" data-ev="${EV.indexOf(g[0])}">${g[0].t?hh(g[0].t)+", ":""}${L[l].f} : ${g[0].ti}</button>`:`<button class="row" style="--c:${L[l].c}" data-g="${k}|${l}">${SP[L[l].sp].e} ${L[l].f}, ${g.length} ${unit(l)}</button>`).join(""):'<p class="meta">Aucun événement ce jour-là.</p>'))}
document.addEventListener("click",ev=>{
const t=ev.target;
if(t===ov||t.closest("[data-x]")){ov.hidden=true;return}
if(t.dataset&&t.dataset.hid!==undefined){t.checked?hid.delete(t.dataset.hid):hid.add(t.dataset.hid);sv();refresh();return}
const b=t.closest("button");if(!b)return;
const D=b.dataset;
if(D.sp){fav=D.sp==="fav";sp=fav?"all":D.sp;lg="all";tm="all";filters();grid()}
else if(D.lg){lg=D.lg;tm="all";filters();grid()}
else if(D.tm){tm=D.tm;filters();grid()}
else if(D.ev!==undefined)detail(+D.ev);
else if(D.day)day(D.day);
else if(D.go)go(D.go);
else if(D.g)grp(D.g);
else if(D.fl){fl.has(D.fl)?fl.delete(D.fl):fl.add(D.fl);b.setAttribute("aria-pressed",fl.has(D.fl));sv();refresh()}
else if(D.sa||D.sn){const s=D.sa||D.sn;for(const [k,l] of Object.entries(L))if(l.sp===s){D.sa?hid.delete(k):hid.add(k)}document.querySelectorAll('input[data-s="'+s+'"]').forEach(i=>{i.checked=!!D.sa});sv();refresh()}
else if(D.ft){ft.add(D.ft);sv();tfav();$("#tq").value="";$("#tres").innerHTML="";refresh()}
else if(D.fx){ft.delete(D.fx);sv();tfav();refresh()}
else if(b.id==="cfg"||b.id==="cfg2")cfgOpen();
else if(b.id==="prev"){cur.m--;if(cur.m<0){cur.m=11;cur.y--}grid()}
else if(b.id==="next"){cur.m++;if(cur.m>11){cur.m=0;cur.y++}grid()}
else if(b.id==="today"){cur={y:Y,m:now.getMonth()};grid()}
});
document.addEventListener("input",e=>{if(e.target.id==="tq")tres()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")ov.hidden=true});
addEventListener("resize",grid);
Promise.all(["data.json","manual.json"].map(u=>fetch(u).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>({events:[]})))).then(([j,m])=>{const mx={};j.events.forEach(e=>{if((j.real||[]).includes(e.l)&&(!mx[e.l]||e.d>mx[e.l]))mx[e.l]=e.d});EV=j.events.concat(m.events.filter(e=>!(mx[e.l]&&e.d<=mx[e.l]))).sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t));(j.real||[]).forEach(k=>{if(L[k])L[k].r=1});const ex=Object.entries(L).filter(([k,l])=>!l.r&&EV.some(e=>e.l===k)).map(([k,l])=>l.f);$("#src").textContent=ex.length?"Données d'exemple (non réelles) : "+ex.join(", ")+". Les autres calendriers sont réels, certains sans horaires. Heure de Paris.":"Calendriers réels, certains sans horaires. Heure de Paris.";filters();grid();home();if(j.updatedAt)$("#upd").textContent="Données mises à jour le "+new Date(j.updatedAt).toLocaleDateString("fr-FR",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}).catch(()=>{$("#tl").innerHTML='<p class="empty">Impossible de charger les données.</p>'});
</script>
</body>
</html>
